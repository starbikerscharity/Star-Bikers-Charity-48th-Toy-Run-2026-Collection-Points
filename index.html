<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Bikers Toy Run 2026 – Collection Points</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}header{background:#111;color:#fff;padding:18px 20px}h1{font-size:1.35rem;margin:0 0 6px}.sub{opacity:.85}main{max-width:1200px;margin:auto;padding:16px}.panel{background:#fff;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px #ccc}form{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:220px;padding:12px;border:1px solid #bbb;border-radius:6px;font-size:1rem}button{padding:12px 18px;border:0;border-radius:6px;background:#222;color:#fff;font-weight:bold;cursor:pointer}#map{height:520px;border-radius:10px}.result{font-size:1.05rem}.muted{color:#666}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.card{background:#fff;padding:12px;border-radius:8px;border:1px solid #ddd}.card strong{display:block;margin-bottom:4px}</style></head><body><header><h1>Star Bikers Toy Run 2026 – Collection Points</h1><div class="sub">Find your nearest public collection point by postcode.</div></header><main><section class="panel"><form id="searchForm"><input id="postcode" aria-label="UK postcode" placeholder="Enter your postcode, e.g. ST1 1AA" autocomplete="postal-code"><button type="submit">Find nearest</button></form><div id="result" class="result" style="margin-top:12px"></div></section><section class="panel"><div id="map"></div></section><section class="panel"><h2>Collection points</h2><div id="status" class="muted">Loading locations…</div><div id="cards"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([53,-2.15],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);let points=[],markers=[],markerByPoint=new Map();const statusEl=document.getElementById('status'),resultEl=document.getElementById('result'),cardsEl=document.getElementById('cards'),input=document.getElementById('postcode');function norm(s){return(s||'').toString().trim().toUpperCase().replace(/\s+/g,' ')}function distanceKm(a,b,c,d){const R=6371,rad=x=>x*Math.PI/180,dLat=rad(c-a),dLon=rad(d-b),q=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function esc(s){return(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function showPoints(){cardsEl.innerHTML=points.map(p=>`<div class="card"><strong>${esc(p.name)}</strong><div>${esc(p.address||'')}</div><div>${esc(p.postcode||'')}</div></div>`).join('')}async function geocodeAll(){const unique=[...new Set(points.filter(p=>p.postcode).map(p=>p.postcode))];for(let i=0;i<unique.length;i+=100){const batch=unique.slice(i,i+100),res=await fetch('https://api.postcodes.io/postcodes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({postcodes:batch})}),j=await res.json(),by={};(j.result||[]).forEach(x=>{if(x.result)by[norm(x.query)]={lat:x.result.latitude,lon:x.result.longitude}});points.forEach(p=>{const g=by[norm(p.postcode)];if(g){p.lat=g.lat;p.lon=g.lon}})}points.forEach(p=>{if(p.lat!=null){const m=L.marker([p.lat,p.lon]).addTo(map);m.bindPopup(`<strong>${esc(p.name)}</strong><br>${esc(p.address||'')}<br>${esc(p.postcode||'')}`);markers.push(m);markerByPoint.set(p,m)}});const mapped=points.filter(p=>p.lat!=null);if(mapped.length)map.fitBounds(L.latLngBounds(mapped.map(p=>[p.lat,p.lon])),{padding:[20,20]});statusEl.textContent=`${points.length} collection points loaded; ${mapped.length} have mappable postcodes.`;showPoints()}document.getElementById('searchForm').addEventListener('submit',async e=>{e.preventDefault();const pc=norm(input.value);if(!pc){resultEl.textContent='Please enter a postcode.';return}resultEl.textContent='Finding the nearest collection point…';try{const r=await fetch('https://api.postcodes.io/postcodes/'+encodeURIComponent(pc));if(!r.ok)throw 0;const j=await r.json(),u=j.result,mapped=points.filter(p=>p.lat!=null);mapped.forEach(p=>p.distance=distanceKm(u.latitude,u.longitude,p.lat,p.lon));mapped.sort((a,b)=>a.distance-b.distance);const nearest=mapped[0];map.setView([nearest.lat,nearest.lon],14);markers.forEach(m=>m.closePopup());const marker=markerByPoint.get(nearest);if(marker)marker.openPopup();resultEl.innerHTML=`Nearest: <strong>${esc(nearest.name)}</strong> – ${nearest.distance.toFixed(1)} km away.<br>${esc(nearest.address||'')} ${esc(nearest.postcode||'')}`}catch(err){resultEl.textContent='Sorry, that postcode could not be found. Please check it and try again.'}});fetch('data.json').then(r=>r.json()).then(d=>{points=d;geocodeAll()}).catch(()=>statusEl.textContent='Could not load collection-point data.');</script></body></html>
